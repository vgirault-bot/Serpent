<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05080a">
<title>SERPENT · Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Major+Mono+Display&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05080a;
    --bg-grid: #0a1014;
    --neon: #00ff9c;
    --neon-dim: #00b870;
    --neon-glow: #00ff9c66;
    --cyan: #33ffee;
    --magenta: #ff3eb5;
    --gold: #ffd700;
    --danger: #ff3860;
    --food: #ffcc00;
    --text: #d8ffe9;
    --muted: #4a6b5a;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'VT323', monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
  }
  body { touch-action: none; }

  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
    z-index: 100;
    mix-blend-mode: multiply;
  }

  .stage {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
  }

  .header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 10px 16px 6px;
    gap: 10px;
    flex-shrink: 0;
  }
  .header-stat { display: flex; flex-direction: column; }
  .header-stat.right { text-align: right; align-items: flex-end; }
  .stat-label { font-size: 11px; letter-spacing: 0.3em; color: var(--muted); text-transform: uppercase; }
  .stat-value { font-size: 28px; color: var(--neon); text-shadow: 0 0 8px var(--neon-glow); line-height: 1; font-variant-numeric: tabular-nums; transition: color 0.2s; }
  .stat-value.hot { color: var(--cyan); text-shadow: 0 0 12px var(--cyan); }
  .title { font-family: 'Major Mono Display', monospace; font-size: 20px; letter-spacing: 0.4em; color: var(--neon); text-shadow: 0 0 6px var(--neon), 0 0 14px var(--neon-glow); margin-left: 0.4em; }

  .arena-wrap { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 6px; min-height: 0; }
  .arena {
    position: relative;
    border: 2px solid var(--neon);
    box-shadow: 0 0 0 3px var(--bg), 0 0 20px var(--neon-glow), inset 0 0 30px rgba(0,255,156,0.05);
    background: var(--bg-grid);
    touch-action: none;
    transition: border-color 0.4s, box-shadow 0.4s;
  }
  .arena.combo-3 { border-color: var(--cyan); box-shadow: 0 0 0 3px var(--bg), 0 0 24px rgba(51,255,238,0.5), inset 0 0 30px rgba(51,255,238,0.06); }
  canvas { display: block; image-rendering: pixelated; touch-action: none; }

  /* Combo bar en haut de l'arène */
  .combo-bar {
    position: absolute;
    top: 6px; left: 6px; right: 6px;
    height: 3px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    z-index: 5;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    overflow: hidden;
  }
  .combo-bar.active { opacity: 1; }
  .combo-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--neon), var(--cyan));
    border-radius: 2px;
    width: 100%;
    transform-origin: left;
    box-shadow: 0 0 6px var(--neon-glow);
  }

  /* Badge multiplicateur top-right */
  .combo-badge {
    position: absolute;
    top: 16px; right: 12px;
    font-family: 'Major Mono Display', monospace;
    font-size: 26px;
    color: var(--cyan);
    text-shadow: 0 0 12px rgba(51,255,238,0.7);
    z-index: 5;
    opacity: 0;
    transform: scale(0.5);
    transition: opacity 0.15s;
    pointer-events: none;
    font-weight: bold;
    letter-spacing: 0.05em;
  }
  .combo-badge.active { opacity: 1; transform: scale(1); }
  .combo-badge.pulse { animation: comboPulse 0.4s ease-out; }
  @keyframes comboPulse {
    0% { transform: scale(1.7); }
    100% { transform: scale(1); }
  }

  .overlay {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: rgba(5,8,10,0.92);
    backdrop-filter: blur(6px);
    text-align: center; padding: 20px;
    z-index: 10;
    pointer-events: none;
  }
  .overlay.visible { display: flex; pointer-events: auto; }
  .overlay-title { font-family: 'Major Mono Display', monospace; font-size: 26px; letter-spacing: 0.25em; color: var(--neon); text-shadow: 0 0 12px var(--neon-glow); margin-bottom: 10px; animation: pulse 1.6s ease-in-out infinite; }
  .overlay.dead .overlay-title { color: var(--danger); text-shadow: 0 0 12px rgba(255,56,96,0.6); }
  .overlay-text { font-size: 16px; color: var(--text); margin-bottom: 4px; }
  .overlay-hint { font-size: 13px; color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase; margin-top: 18px; animation: blink 1s step-end infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
  @keyframes blink { 50% { opacity: 0.3; } }

  /* Stats Game Over */
  .go-stats { display: none; flex-direction: column; gap: 4px; margin-top: 6px; min-width: 180px; }
  .overlay.dead .go-stats { display: flex; }
  .go-row {
    display: flex; justify-content: space-between;
    font-size: 16px;
    padding: 3px 0;
    border-bottom: 1px dashed rgba(255,255,255,0.08);
  }
  .go-row span:first-child { color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; font-size: 12px; }
  .go-row span:last-child { color: var(--text); font-variant-numeric: tabular-nums; }
  .record-flag {
    display: none;
    margin: 12px 0 4px;
    padding: 4px 12px;
    background: rgba(255,215,0,0.12);
    border: 1px solid var(--gold);
    color: var(--gold);
    font-size: 13px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    text-shadow: 0 0 8px rgba(255,215,0,0.6);
    animation: pulse 1s ease-in-out infinite;
  }
  .overlay.dead.record .record-flag { display: inline-block; }

  .mode-row {
    display: flex; align-items: center; justify-content: center;
    gap: 14px; padding: 6px 16px 4px; flex-shrink: 0;
  }
  .mode-btn {
    background: transparent; border: none;
    color: var(--muted);
    font-family: 'VT323', monospace; font-size: 15px;
    letter-spacing: 0.25em; text-transform: uppercase;
    padding: 4px 6px; cursor: pointer;
    touch-action: manipulation;
  }
  .mode-btn.active { color: var(--neon); text-shadow: 0 0 8px var(--neon-glow); }
  .mode-sep { color: var(--muted); opacity: 0.4; font-size: 14px; }

  .controls {
    flex-shrink: 0;
    padding: 6px 16px 14px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 10px;
    align-items: center;
  }

  .dpad { width: 216px; height: 216px; position: relative; margin: 0 auto; grid-column: 2; touch-action: none; }
  .dpad-btn {
    position: absolute;
    background: rgba(0,255,156,0.06);
    border: 1px solid var(--neon-dim);
    color: var(--neon);
    font-size: 36px;
    display: flex; align-items: center; justify-content: center;
    width: 72px; height: 72px;
    font-family: inherit;
    touch-action: none;
    transition: background 0.08s, transform 0.08s;
  }
  .dpad-btn.active, .dpad-btn:active {
    background: rgba(0,255,156,0.3);
    box-shadow: inset 0 0 14px var(--neon-glow);
    transform: scale(0.95);
  }
  .dpad-btn.up    { top: 0;    left: 72px; border-radius: 10px 10px 0 0; }
  .dpad-btn.down  { bottom: 0; left: 72px; border-radius: 0 0 10px 10px; }
  .dpad-btn.left  { top: 72px; left: 0;    border-radius: 10px 0 0 10px; }
  .dpad-btn.right { top: 72px; right: 0;   border-radius: 0 10px 10px 0; }

  .side-btn {
    height: 60px;
    border: 1px solid var(--neon-dim);
    background: rgba(0,255,156,0.04);
    color: var(--neon);
    font-family: 'VT323', monospace;
    font-size: 16px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    width: 100%;
    border-radius: 8px;
    touch-action: none;
    transition: all 0.08s;
  }
  .side-btn.active, .side-btn:active {
    background: rgba(0,255,156,0.25);
    box-shadow: inset 0 0 14px var(--neon-glow);
  }
  .side-btn-wrap { display: flex; flex-direction: column; gap: 8px; height: 216px; justify-content: center; }

  @media (max-height: 740px) {
    .dpad { width: 180px; height: 180px; }
    .dpad-btn { width: 60px; height: 60px; font-size: 30px; }
    .dpad-btn.up { left: 60px; }
    .dpad-btn.down { left: 60px; }
    .dpad-btn.left { top: 60px; }
    .dpad-btn.right { top: 60px; }
    .side-btn-wrap { height: 180px; }
    .side-btn { height: 52px; }
    .header { padding: 6px 16px 4px; }
    .stat-value { font-size: 24px; }
    .mode-btn { font-size: 13px; }
    .overlay-title { font-size: 22px; }
    .combo-badge { font-size: 22px; top: 12px; right: 10px; }
  }
</style>
</head>
<body>
<div class="stage">

  <header class="header">
    <div class="header-stat">
      <span class="stat-label">Score</span>
      <span class="stat-value" id="score">0</span>
    </div>
    <h1 class="title">Serpent</h1>
    <div class="header-stat right">
      <span class="stat-label">Record</span>
      <span class="stat-value" id="best">0</span>
    </div>
  </header>

  <main class="arena-wrap">
    <div class="arena" id="arena">
      <canvas id="game"></canvas>
      <div class="combo-bar" id="comboBar"><div class="combo-bar-fill" id="comboBarFill"></div></div>
      <div class="combo-badge" id="comboBadge">×<span id="comboLevel">2</span></div>
      <div class="overlay" id="overlay">
        <div class="overlay-title" id="overlayTitle">Prêt ?</div>
        <div class="overlay-text" id="overlayText">Mange vite pour combos</div>
        <div class="record-flag">Nouveau record</div>
        <div class="go-stats">
          <div class="go-row"><span>Score</span><span id="goScore">0</span></div>
          <div class="go-row"><span>Longueur</span><span id="goLength">3</span></div>
          <div class="go-row"><span>Combo max</span><span id="goCombo">×1</span></div>
          <div class="go-row"><span>Durée</span><span id="goDuration">0s</span></div>
        </div>
        <div class="overlay-hint" id="overlayHint">Touche pour démarrer</div>
      </div>
    </div>
  </main>

  <div class="mode-row">
    <button class="mode-btn active" data-mode="easy" type="button">Facile</button>
    <span class="mode-sep">·</span>
    <button class="mode-btn" data-mode="normal" type="button">Normal</button>
    <span class="mode-sep">·</span>
    <button class="mode-btn" data-mode="hard" type="button">Rapide</button>
  </div>

  <div class="controls">
    <div class="side-btn-wrap">
      <button class="side-btn" id="pauseBtn" type="button">Pause</button>
    </div>
    <div class="dpad">
      <button class="dpad-btn up"    data-dir="up"    type="button">▲</button>
      <button class="dpad-btn down"  data-dir="down"  type="button">▼</button>
      <button class="dpad-btn left"  data-dir="left"  type="button">◄</button>
      <button class="dpad-btn right" data-dir="right" type="button">►</button>
    </div>
    <div class="side-btn-wrap">
      <button class="side-btn" id="restartBtn" type="button">Restart</button>
    </div>
  </div>
</div>

<script>
(() => {
  // ===== DOM =====
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const arena = document.getElementById('arena');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const overlayHint = document.getElementById('overlayHint');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const comboBar = document.getElementById('comboBar');
  const comboBarFill = document.getElementById('comboBarFill');
  const comboBadge = document.getElementById('comboBadge');
  const comboLevelEl = document.getElementById('comboLevel');

  // ===== CONFIG =====
  const COLS = 20, ROWS = 20;
  let CELL = 18;
  const MODES = {
    easy:   { base: 190, min: 120, step: 2 },
    normal: { base: 130, min: 70,  step: 3 },
    hard:   { base: 95,  min: 45,  step: 4 },
  };
  const FOOD_TYPES = {
    normal:  { value: 10,  weight: 90 },
    gold:    { value: 30,  weight: 8  },
    rainbow: { value: 100, weight: 2, life: 5000 },
  };
  const COMBO_WINDOW = 4000;
  const MAX_COMBO = 4;

  // ===== ÉTAT =====
  let difficulty = 'easy';
  try {
    const saved = localStorage.getItem('snake_mobile_mode');
    if (saved && MODES[saved]) difficulty = saved;
  } catch(e) {}

  let snake, dir, nextDir, food, particles, popups, trail;
  let score, best, displayedScore, tickInterval, alive, paused, lastTick;
  let combo, lastEatTime, maxCombo;
  let gameStartTime, totalPauseTime, pauseStartTime;
  let slowdownUntil, shakeTime, shakeIntensity;

  try { best = parseInt(localStorage.getItem('snake_mobile_best') || '0', 10) || 0; } catch(e) { best = 0; }
  bestEl.textContent = best;

  // ===== AUDIO =====
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
  }
  function beep(freq, duration, type = 'square', vol = 0.05, when = 0) {
    if (!audioCtx) return;
    try {
      const t0 = audioCtx.currentTime + when;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(vol, t0);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + duration);
    } catch(e) {}
  }
  function sndEat()    { beep(680, 0.06, 'square', 0.04); beep(880, 0.05, 'square', 0.03, 0.04); }
  function sndGold()   { beep(900, 0.08, 'square', 0.05); beep(1200, 0.08, 'square', 0.05, 0.06); beep(1500, 0.10, 'square', 0.05, 0.12); }
  function sndRainbow(){ [600, 800, 1000, 1300, 1600].forEach((f, i) => beep(f, 0.10, 'square', 0.05, i * 0.05)); }
  function sndCombo(level){ beep(400 + level * 150, 0.08, 'sawtooth', 0.04); beep(600 + level * 150, 0.10, 'sawtooth', 0.04, 0.06); }
  function sndDie()    { [500, 380, 280, 200, 140].forEach((f, i) => beep(f, 0.14, 'sawtooth', 0.06, i * 0.07)); }

  // ===== UI =====
  function updateModeButtons() {
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mode === difficulty);
    });
  }
  updateModeButtons();

  function fitCanvas() {
    const wrap = document.querySelector('.arena-wrap');
    const w = Math.max(wrap.clientWidth - 12, 100);
    const h = Math.max(wrap.clientHeight - 12, 100);
    const size = Math.min(w, h);
    CELL = Math.max(8, Math.floor(size / COLS));
    canvas.width = COLS * CELL;
    canvas.height = ROWS * CELL;
    canvas.style.width = canvas.width + 'px';
    canvas.style.height = canvas.height + 'px';
    draw();
  }

  function showOverlay(opts) {
    const { title, text, hint, dead = false, gameOver = false, record = false } = opts;
    overlayTitle.textContent = title;
    overlayText.textContent = text || '';
    overlayHint.textContent = hint || '';
    overlay.classList.toggle('dead', dead);
    overlay.classList.toggle('record', record);
    overlay.classList.add('visible');
    if (gameOver) {
      document.getElementById('goScore').textContent = score;
      document.getElementById('goLength').textContent = snake.length;
      document.getElementById('goCombo').textContent = '×' + maxCombo;
      const dur = Math.round((performance.now() - gameStartTime - totalPauseTime) / 1000);
      document.getElementById('goDuration').textContent = dur + 's';
    }
  }
  function hideOverlay() { overlay.classList.remove('visible'); }

  function updateComboUI() {
    if (combo > 1) {
      const elapsed = performance.now() - lastEatTime;
      const ratio = Math.max(0, 1 - elapsed / COMBO_WINDOW);
      if (ratio === 0) {
        combo = 1;
        comboBar.classList.remove('active');
        comboBadge.classList.remove('active');
        arena.classList.remove('combo-3');
      } else {
        comboBar.classList.add('active');
        comboBarFill.style.transform = `scaleX(${ratio})`;
        comboBadge.classList.add('active');
        comboLevelEl.textContent = combo;
        arena.classList.toggle('combo-3', combo >= 3);
      }
    } else {
      comboBar.classList.remove('active');
      comboBadge.classList.remove('active');
      arena.classList.remove('combo-3');
    }
  }

  // ===== GAME =====
  function reset() {
    const cx = Math.floor(COLS / 2);
    const cy = Math.floor(ROWS / 2);
    snake = [
      { x: cx - 1, y: cy }, { x: cx, y: cy }, { x: cx + 1, y: cy },
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0; displayedScore = 0;
    particles = []; popups = []; trail = [];
    alive = true; paused = true;
    combo = 1; lastEatTime = 0; maxCombo = 1;
    gameStartTime = performance.now(); totalPauseTime = 0; pauseStartTime = performance.now();
    slowdownUntil = 0; shakeTime = 0; shakeIntensity = 0;
    tickInterval = MODES[difficulty].base;
    placeFood();
    scoreEl.textContent = 0;
    bestEl.textContent = best;
    scoreEl.classList.remove('hot');
    showOverlay({ title: 'Prêt ?', text: 'Mange vite pour combos', hint: 'Touche pour démarrer' });
    updateComboUI();
    draw();
  }

  function pickFoodType() {
    const r = Math.random() * 100;
    if (r < 2) return 'rainbow';
    if (r < 10) return 'gold';
    return 'normal';
  }

  function placeFood() {
    let type = pickFoodType();
    while (true) {
      const f = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) {
        food = { x: f.x, y: f.y, type, spawnTime: performance.now() };
        return;
      }
    }
  }

  function unpauseIfNeeded() {
    if (paused && alive) {
      const pauseDur = performance.now() - pauseStartTime;
      totalPauseTime += pauseDur;
      lastEatTime += pauseDur;
      if (food) food.spawnTime += pauseDur;
      paused = false;
      hideOverlay();
      ensureAudio();
      return true;
    }
    return false;
  }
  function pauseGame() {
    if (alive && !paused) {
      paused = true;
      pauseStartTime = performance.now();
      showOverlay({ title: 'Pause', text: 'En attente', hint: 'Touche pour reprendre' });
    }
  }
  function togglePause() {
    if (!alive) { reset(); return; }
    if (paused) unpauseIfNeeded(); else pauseGame();
  }

  function tick() {
    if (!alive || paused) return;

    // expire combo
    if (combo > 1 && performance.now() - lastEatTime > COMBO_WINDOW) combo = 1;
    // expire rainbow
    if (food && food.type === 'rainbow' && FOOD_TYPES.rainbow.life &&
        performance.now() - food.spawnTime > FOOD_TYPES.rainbow.life) {
      placeFood();
    }

    dir = nextDir;
    const head = { x: snake[snake.length - 1].x + dir.x, y: snake[snake.length - 1].y + dir.y };
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return die();
    if (snake.some(s => s.x === head.x && s.y === head.y)) return die();
    snake.push(head);

    if (head.x === food.x && head.y === food.y) {
      const t = food.type;
      const baseValue = FOOD_TYPES[t].value;
      const now = performance.now();
      const inCombo = (now - lastEatTime) < COMBO_WINDOW && lastEatTime > 0;
      if (inCombo) combo = Math.min(combo + 1, MAX_COMBO);
      else combo = 1;
      lastEatTime = now;
      if (combo > maxCombo) maxCombo = combo;

      const points = baseValue * combo;
      score += points;
      if (score > best) {
        best = score;
        try { localStorage.setItem('snake_mobile_best', best); } catch(e) {}
      }

      // popup
      const popText = '+' + points + (combo > 1 ? ' ×' + combo : '');
      const popColor = t === 'rainbow' ? 'rainbow' : t === 'gold' ? 'gold' : (combo > 1 ? 'cyan' : 'neon');
      const popSize = t === 'rainbow' ? 1.4 : t === 'gold' ? 1.15 : 1;
      popups.push({
        x: (food.x + 0.5) * CELL, y: (food.y + 0.3) * CELL,
        text: popText, color: popColor, size: popSize,
        life: 50, max: 50, vy: -1.4
      });

      // particules
      const partColor = t === 'rainbow' ? 'rainbow' : t === 'gold' ? '255,215,0' : '255,204,0';
      const nParts = t === 'rainbow' ? 24 : t === 'gold' ? 18 : 12;
      for (let i = 0; i < nParts; i++) {
        particles.push({
          x: (food.x + 0.5) * CELL, y: (food.y + 0.5) * CELL,
          vx: (Math.random() - 0.5) * 7, vy: (Math.random() - 0.5) * 7,
          life: 28, max: 28, color: partColor
        });
      }

      // sons
      if (t === 'rainbow') sndRainbow();
      else if (t === 'gold') sndGold();
      else sndEat();
      if (combo >= 2) sndCombo(combo);

      // pulse badge
      if (combo > 1) {
        comboBadge.classList.remove('pulse');
        void comboBadge.offsetWidth;
        comboBadge.classList.add('pulse');
      }

      // bonus rainbow : ralentissement court
      if (t === 'rainbow') slowdownUntil = performance.now() + 2000;

      // vibration
      if (navigator.vibrate) try { navigator.vibrate(t === 'rainbow' ? [30, 20, 30] : t === 'gold' ? 25 : 12); } catch(e) {}

      placeFood();
      tickInterval = Math.max(MODES[difficulty].min, tickInterval - MODES[difficulty].step);
    } else {
      snake.shift();
    }
  }

  function die() {
    alive = false;
    const head = snake[snake.length - 1];
    for (let i = 0; i < 36; i++) {
      particles.push({
        x: (head.x + 0.5) * CELL, y: (head.y + 0.5) * CELL,
        vx: (Math.random() - 0.5) * 11, vy: (Math.random() - 0.5) * 11,
        life: 45, max: 45, color: '255,56,96'
      });
    }
    shakeTime = 25; shakeIntensity = 9;
    sndDie();
    if (navigator.vibrate) try { navigator.vibrate([60, 40, 100]); } catch(e) {}
    const isRecord = score > 0 && score === best;
    showOverlay({
      title: 'Game Over',
      text: '',
      hint: 'Touche pour rejouer',
      dead: true, gameOver: true, record: isRecord,
    });
  }

  // ===== RENDU =====
  function bgColor() {
    // 0 → bleu nuit, 200+ → magenta chaud
    const t = Math.min(score / 200, 1);
    const r = Math.round(10 + t * 30);
    const g = Math.round(16 - t * 4);
    const b = Math.round(20 + t * 25);
    return `rgb(${r},${g},${b})`;
  }

  function draw() {
    const now = performance.now();

    ctx.save();
    if (shakeTime > 0) {
      const sx = (Math.random() - 0.5) * shakeIntensity;
      const sy = (Math.random() - 0.5) * shakeIntensity;
      ctx.translate(sx, sy);
      shakeTime--;
      shakeIntensity *= 0.92;
    }

    // fond avec teinte selon score
    ctx.fillStyle = bgColor();
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // grille
    ctx.strokeStyle = combo >= 3 ? 'rgba(51,255,238,0.05)' : 'rgba(0,255,156,0.04)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x * CELL + 0.5, 0); ctx.lineTo(x * CELL + 0.5, canvas.height); ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * CELL + 0.5); ctx.lineTo(canvas.width, y * CELL + 0.5); ctx.stroke();
    }

    // bouffe
    if (food) drawFood(now);

    // serpent
    if (snake) drawSnake();

    // particules
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vx *= 0.92; p.vy *= 0.92; p.life--;
      const a = p.life / p.max;
      if (p.color === 'rainbow') {
        const hue = (now / 8 + i * 30) % 360;
        ctx.fillStyle = `hsla(${hue}, 100%, 60%, ${a})`;
      } else {
        ctx.fillStyle = `rgba(${p.color}, ${a})`;
      }
      ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // popups
    ctx.textAlign = 'center';
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i];
      p.y += p.vy; p.vy *= 0.95; p.life--;
      const a = Math.min(1, p.life / 25);
      const fontSize = Math.round(CELL * 1.0 * p.size);
      ctx.font = `bold ${fontSize}px 'VT323', monospace`;
      let color;
      if (p.color === 'rainbow') {
        const hue = (now / 4) % 360;
        color = `hsla(${hue}, 100%, 65%, ${a})`;
      } else if (p.color === 'gold') {
        color = `rgba(255, 215, 0, ${a})`;
      } else if (p.color === 'cyan') {
        color = `rgba(51, 255, 238, ${a})`;
      } else {
        color = `rgba(0, 255, 156, ${a})`;
      }
      ctx.shadowBlur = 10;
      ctx.shadowColor = color;
      ctx.fillStyle = color;
      ctx.fillText(p.text, p.x, p.y);
      ctx.shadowBlur = 0;
      if (p.life <= 0) popups.splice(i, 1);
    }

    ctx.restore();
  }

  function drawFood(now) {
    const fx = (food.x + 0.5) * CELL;
    const fy = (food.y + 0.5) * CELL;

    if (food.type === 'rainbow') {
      const hue = (now / 8) % 360;
      const lifeLeft = 1 - (now - food.spawnTime) / FOOD_TYPES.rainbow.life;
      const flash = lifeLeft < 0.3 ? (Math.sin(now / 60) * 0.5 + 0.5) : 1;
      ctx.shadowBlur = 26;
      ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
      ctx.fillStyle = `hsla(${hue}, 100%, 60%, ${flash})`;
      const rad = CELL * 0.42 + Math.sin(now / 80) * 3;
      ctx.beginPath(); ctx.arc(fx, fy, rad, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      // étoile au centre
      ctx.fillStyle = `hsla(${(hue + 180) % 360}, 100%, 90%, ${flash})`;
      ctx.beginPath(); ctx.arc(fx, fy, CELL * 0.15, 0, Math.PI * 2); ctx.fill();
    } else if (food.type === 'gold') {
      const pulse = 0.5 + Math.sin(now / 150) * 0.25;
      ctx.shadowBlur = 22;
      ctx.shadowColor = '#ffd700';
      ctx.fillStyle = '#ffd700';
      ctx.beginPath(); ctx.arc(fx, fy, CELL * 0.4 + pulse * 3, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff8c0';
      ctx.beginPath(); ctx.arc(fx - 3, fy - 3, CELL * 0.14, 0, Math.PI * 2); ctx.fill();
    } else {
      const pulse = 0.5 + Math.sin(now / 300) * 0.15;
      ctx.shadowBlur = 16; ctx.shadowColor = '#ffcc00';
      ctx.fillStyle = '#ffcc00';
      ctx.beginPath(); ctx.arc(fx, fy, CELL * 0.35 + pulse * 2, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff5a8';
      ctx.beginPath(); ctx.arc(fx - 2, fy - 2, CELL * 0.12, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawSnake() {
    const len = snake.length;
    const comboGlow = (combo - 1) * 6;
    const comboTint = (combo - 1) / (MAX_COMBO - 1);
    for (let i = 0; i < len; i++) {
      const seg = snake[i];
      const isHead = i === len - 1;
      const ratio = i / Math.max(len - 1, 1);
      const px = seg.x * CELL;
      const py = seg.y * CELL;
      if (isHead) {
        ctx.shadowBlur = 14 + comboGlow;
        const hr = Math.round(0 + comboTint * 51);
        const hg = Math.round(255 - comboTint * 0);
        const hb = Math.round(156 + comboTint * 82);
        ctx.shadowColor = `rgb(${hr},${hg},${hb})`;
      } else {
        ctx.shadowBlur = 0;
      }
      const r = Math.round(0 + ratio * 100 + comboTint * 30);
      const g = Math.round(184 + ratio * 71 - comboTint * 10);
      const b = Math.round(112 + ratio * 44 + comboTint * 80);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      const inset = isHead ? 1 : 2;
      const radius = isHead ? 5 : 3;
      roundRect(ctx, px + inset, py + inset, CELL - inset * 2, CELL - inset * 2, radius);
      ctx.fill();
      if (isHead) {
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#05080a';
        const cx = px + CELL / 2, cy = py + CELL / 2;
        const ox = dir.x * 3, oy = dir.y * 3;
        const perpX = -dir.y * 4, perpY = dir.x * 4;
        ctx.beginPath();
        ctx.arc(cx + ox + perpX, cy + oy + perpY, 2, 0, Math.PI * 2);
        ctx.arc(cx + ox - perpX, cy + oy - perpY, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.shadowBlur = 0;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // score animé
  function tweenScore() {
    if (displayedScore === score) return;
    const diff = score - displayedScore;
    if (Math.abs(diff) <= 2) displayedScore = score;
    else displayedScore += Math.sign(diff) * Math.max(2, Math.ceil(Math.abs(diff) / 6));
    scoreEl.textContent = displayedScore;
    scoreEl.classList.toggle('hot', combo >= 3);
  }

  function loop(now) {
    if (!lastTick) lastTick = now;
    let interval = tickInterval;
    if (now < slowdownUntil) interval = Math.max(tickInterval, 220);
    if (now - lastTick >= interval) { tick(); lastTick = now; }
    tweenScore();
    updateComboUI();
    draw();
    requestAnimationFrame(loop);
  }

  function setDir(d) {
    if (!alive) return;
    if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
  }

  // ===== INPUT =====
  arena.addEventListener('pointerdown', e => {
    if (e.cancelable) e.preventDefault();
    ensureAudio();
    if (!alive) { reset(); return; }
    if (paused) { unpauseIfNeeded(); return; }
    const rect = canvas.getBoundingClientRect();
    const tapX = (e.clientX - rect.left) / CELL;
    const tapY = (e.clientY - rect.top) / CELL;
    const head = snake[snake.length - 1];
    const dx = tapX - (head.x + 0.5);
    const dy = tapY - (head.y + 0.5);
    if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir({ x: dx > 0 ? 1 : -1, y: 0 });
    else setDir({ x: 0, y: dy > 0 ? 1 : -1 });
  });

  const dirs = {
    up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
    left: { x: -1, y: 0 }, right: { x: 1, y: 0 },
  };

  document.querySelectorAll('.dpad-btn').forEach(btn => {
    const onDown = e => {
      e.preventDefault(); e.stopPropagation();
      ensureAudio();
      btn.classList.add('active');
      unpauseIfNeeded();
      setDir(dirs[btn.dataset.dir]);
    };
    const onUp = () => btn.classList.remove('active');
    btn.addEventListener('pointerdown', onDown);
    btn.addEventListener('pointerup', onUp);
    btn.addEventListener('pointercancel', onUp);
    btn.addEventListener('pointerleave', onUp);
    btn.addEventListener('touchstart', onDown, { passive: false });
    btn.addEventListener('touchend', onUp);
  });

  function bindBtn(id, action) {
    const b = document.getElementById(id);
    const handler = e => { e.preventDefault(); e.stopPropagation(); ensureAudio(); action(); };
    b.addEventListener('pointerdown', handler);
    b.addEventListener('touchstart', handler, { passive: false });
  }
  bindBtn('pauseBtn', togglePause);
  bindBtn('restartBtn', reset);

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      difficulty = btn.dataset.mode;
      try { localStorage.setItem('snake_mobile_mode', difficulty); } catch(e) {}
      updateModeButtons();
      tickInterval = MODES[difficulty].base;
    });
  });

  const keyMap = {
    'ArrowUp': dirs.up, 'KeyW': dirs.up, 'KeyZ': dirs.up,
    'ArrowDown': dirs.down, 'KeyS': dirs.down,
    'ArrowLeft': dirs.left, 'KeyA': dirs.left, 'KeyQ': dirs.left,
    'ArrowRight': dirs.right, 'KeyD': dirs.right,
  };
  document.addEventListener('keydown', e => {
    if (keyMap[e.code]) {
      e.preventDefault(); ensureAudio();
      unpauseIfNeeded();
      setDir(keyMap[e.code]);
    }
    if (e.code === 'Space') { e.preventDefault(); ensureAudio(); togglePause(); }
    if (e.code === 'KeyR') { e.preventDefault(); reset(); }
  });

  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300 && e.cancelable) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());

  if (window.ResizeObserver) {
    const ro = new ResizeObserver(fitCanvas);
    ro.observe(document.querySelector('.arena-wrap'));
  }
  window.addEventListener('resize', fitCanvas);
  window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 200));

  requestAnimationFrame(() => {
    fitCanvas();
    requestAnimationFrame(fitCanvas);
  });

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
